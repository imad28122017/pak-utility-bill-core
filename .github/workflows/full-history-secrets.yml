name: Full-history secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL --retry 3 "${base}/gitleaks_${version}_linux_x64.tar.gz" -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL --retry 3 "${base}/gitleaks_${version}_checksums.txt" -o "${RUNNER_TEMP}/checksums.txt"
          cd "${RUNNER_TEMP}"
          grep "  gitleaks_${version}_linux_x64.tar.gz$" checksums.txt | sed "s/gitleaks_${version}_linux_x64.tar.gz/gitleaks.tar.gz/" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan reachable Git history (all refs)
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --log-opts="--all" .
      - name: Scan checked-out files
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" dir --no-banner --redact .
